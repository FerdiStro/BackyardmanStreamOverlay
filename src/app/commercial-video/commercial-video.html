<div class="fixed inset-0 h-screen w-screen z-50 flex items-center justify-center bg-bg  p-8 select-none font-bold">

    <div
            class="relative w-full min-w-6xl  aspect-video bg-[#141414] border-4 border-white/20 border-l-default-yellow shadow-2xl overflow-hidden transition-all duration-3000 ease-out transform-gpu"
            [class.opacity-100]="animateIn()"
            [class.translate-y-0]="animateIn()"
            [class.scale-100]="animateIn()"
            [class.opacity-0]="!animateIn()"
            [class.translate-y-8]="!animateIn()"
            [class.scale-30]="!animateIn()"
    >
        <div class="absolute top-4 left-4 z-10 bg-black/80 text-white font-mono text-xs px-3 py-1.5 border border-white/20 uppercase tracking-wider">
            WERBUNG
        </div>

        @if (activeVideoPath(); as videoSrc) {
            <video
                #videoPlayer
                [src]="videoSrc"
                autoplay
                playsinline
                preload="auto"
                class="w-full h-full object-cover"
            ></video>
        } @else {
            <div class="w-full h-full flex items-center justify-center text-gray-500 font-mono text-sm">
                NO VIDEO FOUND (#{{ clipNr() }})
            </div>
        }
    </div>

</div>
