<div
        class="fixed left-10 top-1/3 h-1/2 bg-bg-transparent p-5 transition-transform ease-out transform-gpu -translate-x-[200%]"
        [style.transitionDuration]="'3s'"
        [class.translate-x-0]="animateIn()"
>
    <div class="text-5xl inline-block text-white font-bold">Still Standing</div>
    <div class="inline-block text-xl ml-2 text-gray-300">{{ athletes().length }} / {{ startNumber }}</div>

    <div class="relative text-white flex-col w-[440px] text-3xl h-11/12  p-2 overflow-hidden">
        <div
                class="w-full flex flex-col"
                [style.transition]="isScrolling() ? 'transform 0.6s ease-in-out' : 'none'"
                [style.transform]="isScrolling() ? 'translateY(-72px)' : 'translateY(0)'"
        >
            @for (athlete of displayAthletes(); track athlete.startNr; let idx = $index) {
                <div
                        class="border-b-2 p-2 mb-4 h-14 rounded-2xl border-b-default-yellow shadow-inner flex flex-col justify-center transition-colors duration-500"
                        [class.bg-bg]="(idx === 0 && !isScrolling()) || (idx === 1 && isScrolling())"
                        [class.bg-pasiv]="!((idx === 0 && !isScrolling()) || (idx === 1 && isScrolling()))"
                >
                    <div class="flex flex-row items-center">
                        <div class="w-1/9 flex justify-center mr-2">
                            @if (athlete.flagUrl) {
                                <img [src]="athlete.flagUrl" alt="Flag" class="w-10 rounded-sm shadow-sm"/>
                            }
                        </div>
                        <div>{{ athlete.name }} <span class="text-xl text-gray-300">#{{ athlete.startNr }}</span></div>
                    </div>

                    <div class="flex flex-row items-center mt-1"></div>
                </div>
            } @empty {
                <p>Lade Renndaten...</p>
            }
        </div>
    </div>
</div>
