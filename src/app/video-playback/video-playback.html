<div class="fixed inset-0 h-screen w-screen z-50 flex flex-col justify-between bg-black/95 p-6 select-none font-bold">

    <div class="w-full  flex items-center justify-between bg-[#141414] border-l-4 border-l-default-yellow border-y border-r border-white/10 p-4 shadow-2xl">
        <div class="flex items-center gap-3">
            <span class="inline-block w-3.5 h-3.5 bg-red-600 rounded-full animate-ping"></span>
            <span class="text-sm uppercase tracking-widest text-white font-extrabold">Instant Replay</span>
        </div>
    </div>

    <div class="flex-1  flex items-center justify-center p-4 min-h-0">

        <div
                class=" bg-white border-4 border-dashed border-white/40 flex flex-col items-center justify-center transition-all duration-500 shadow-2xl relative overflow-hidden"
                [class.h-full]="isPortrait()"
                [class.aspect-[9/16]]="isPortrait()"
        [class.w-full]="!isPortrait()"
        [class.max-w-6xl]="!isPortrait()"
        [class.aspect-[16/9]]="!isPortrait()"
        >
        <div class="absolute top-3 left-3 bg-black/80 text-white font-mono text-[10px] px-2.5 py-1 border border-white/20">
            OBS FRAME
        </div>

        <span class="text-black/30 font-black uppercase tracking-widest text-2xl text-center px-4">
                OBS Video Layer<br>
                <span class="text-base font-mono font-bold">
                    {{ isPortrait() ? 'Vertical (9:16)' : 'Horizontal (16:9)' }}
                </span>
            </span>
    </div>

</div>

<div class="w-full flex items-center justify-between bg-[#141414] border-l-4 border-l-default-yellow border-y border-r border-white/10 p-3 shadow-2xl text-xs text-gray-400">
    <span class="font-mono text-default-yellow">CAMERA FEED</span>
</div>

</div>
